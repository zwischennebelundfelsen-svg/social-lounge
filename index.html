<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fang die Sineps</title><style>
*{box-sizing:border-box}body{margin:0;background:#070a10;color:#fff;font-family:Arial,sans-serif}#app{max-width:1200px;margin:auto;padding:24px}#menu{background:#121925;border:1px solid #394355;border-radius:24px;padding:30px;margin-top:4vh}h1{font-size:48px;margin:5px 0 12px}.gold{color:#e6bb62;font-weight:bold}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}.hero{border:2px solid #394355;border-radius:18px;background:#1a2230;color:#fff;padding:0 0 20px;cursor:pointer;text-align:left}.hero.sel{border:4px solid #e6bb62}.pic{height:190px;display:grid;place-items:center;font-size:70px;border-radius:14px 14px 0 0}.b{background:#5d3d2d}.n{background:#24596d}.s{background:#51376b}.hero b,.hero small{display:block;margin:14px 18px 0}.hero b{font-size:24px}.hero small{color:#b9c0ca}.row{display:flex;gap:16px;align-items:end}select,#start{font-size:18px;padding:14px;border-radius:10px;border:1px solid #566174;background:#202a39;color:#fff}#start{margin-left:auto;background:#e6bb62;color:#17110a;font-weight:bold;cursor:pointer}.status{margin-top:18px;color:#e6bb62;font-weight:bold}#stage{position:relative}canvas{width:100%;height:auto;background:#172a2b;border-radius:18px;display:block}#hud{position:absolute;top:10px;left:10px;right:10px;background:#0009;padding:9px 12px;border-radius:10px;z-index:2;backdrop-filter:blur(6px)}#bossbar{position:absolute;top:58px;left:25%;right:25%;height:14px;background:#140b0b;border:1px solid #ffffff33;border-radius:10px;z-index:3;overflow:hidden}#bossfill{height:100%;width:100%;background:linear-gradient(90deg,#c74242,#f19a52)}#questbox{position:absolute;right:12px;bottom:12px;background:#071016d9;border:1px solid #ffffff22;padding:10px 14px;border-radius:12px;z-index:3;font-size:13px}@media(max-width:700px){.cards{grid-template-columns:1fr}.row{flex-direction:column;align-items:stretch}#start{margin:0}}
</style></head><body><div id="app"><section id="menu"><div class="gold">FANG DIE SINEPS</div><h1>Wähle deinen Jäger</h1><p>Direkter, eigenständiger Browser-Build ohne externe Dateien.</p><div class="cards"><button class="hero sel" onclick="pick('bacon',this)"><div class="pic b">💪</div><b>BACON</b><small>Brecher · Schrotflinte · Berserker</small></button><button class="hero" onclick="pick('nexify',this)"><div class="pic n">🧢</div><b>NexifyGG</b><small>Revolverheld · schnell · Dash</small></button><button class="hero" onclick="pick('sinep',this)"><div class="pic s">✦</div><b>SINEP</b><small>Arkanistin · Runengewehr · Blink</small></button></div><div class="row"><label>Schwierigkeit<br><select id="difficulty" onchange="diffChanged()"><option>Jäger</option><option selected>Veteran</option><option>Albtraum</option></select></label><button id="start" onclick="startGame()">ABENTEUER STARTEN →</button></div><div class="status" id="status">Ausgewählt: BACON · Schwierigkeit: Veteran</div></section><main id="stage" hidden><div id="hud">FANG DIE SINEPS · <span id="who">BACON</span> · <span id="stats">HP 100 · Münzen 0</span></div><div id="bossbar" hidden><div id="bossfill"></div></div><div id="questbox">Quest: Erkunde die Welt</div><div id="riddle" hidden style="position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,88%);padding:22px;background:#0a1019f2;border:1px solid #e6bb62;border-radius:18px;box-shadow:0 20px 70px #000c"><b id="rq" style="font-size:20px"></b><div id="ra" style="display:grid;gap:9px;margin-top:16px"></div></div><canvas id="game" width="1100" height="620"></canvas></main></div><script>var chosen="bacon",running=false,keys={},mx=800,my=300,G=null,last=0;
var H={bacon:{name:"BACON",hp:180,speed:245,color:"#c97843"},nexify:{name:"NexifyGG",hp:120,speed:315,color:"#45a7c8"},sinep:{name:"SINEP",hp:110,speed:275,color:"#a46bd2"}};
function pick(n,el){chosen=n;document.querySelectorAll(".hero").forEach(function(x){x.classList.remove("sel")});el.classList.add("sel");showStatus()}
function diffChanged(){showStatus()}function showStatus(){document.getElementById("status").textContent="Ausgewählt: "+H[chosen].name+" · Schwierigkeit: "+document.getElementById("difficulty").value}
function startGame(){var d=document.getElementById("difficulty").selectedIndex;G={x:90,y:455,vx:0,vy:0,on:false,hp:H[chosen].hp,max:H[chosen].hp,coins:0,cam:0,t:0,jumpHeld:false,shots:[],chests:[{x:650,o:0},{x:1420,o:0},{x:2550,o:0},{x:3430,o:0},{x:4650,o:0},{x:5350,o:0}],enemies:[],bosses:[{x:1830,hp:320+d*100,max:320+d*100,dead:0},{x:3820,hp:420+d*120,max:420+d*120,dead:0},{x:5740,hp:560+d*150,max:560+d*150,dead:0}],done:[0,0,0],diff:1+d*.3,riddles:[{x:1050,done:0,q:"Welche Zahl setzt die Reihe fort: 2, 6, 12, 20, 30, ?",a:["36","40","42"],ok:2},{x:3050,done:0,q:"Eine Tür öffnet nur bei der Zahl, die zugleich durch 3 und 4 teilbar ist. Welche passt?",a:["18","24","30"],ok:1},{x:5050,done:0,q:"Ich werde größer, je mehr man von mir wegnimmt. Was bin ich?",a:["Ein Loch","Ein Schatten","Ein Berg"],ok:0}],riddleOpen:-1};for(var i=0;i<15;i++){var wx=400+i*350,l=wx<2000?0:wx<4000?1:2;G.enemies.push({x:wx,y:l===0?300+(i%3)*45:490,hp:55+20*d,alive:1,type:l})}document.getElementById("menu").hidden=true;document.getElementById("stage").hidden=false;document.getElementById("who").textContent=H[chosen].name;running=true;last=performance.now();requestAnimationFrame(loop)}
addEventListener("keydown",function(e){keys[e.key.toLowerCase()]=true});addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false});var cv=document.getElementById("game");cv.addEventListener("mousemove",function(e){var r=cv.getBoundingClientRect();mx=(e.clientX-r.left)*cv.width/r.width;my=(e.clientY-r.top)*cv.height/r.height});cv.addEventListener("mousedown",function(){keys.fire=true});addEventListener("mouseup",function(){keys.fire=false});
function rr(x,a,b,c,d,r){x.beginPath();if(x.roundRect)x.roundRect(a,b,c,d,r);else x.rect(a,b,c,d)}
function groundY(wx){return wx<2000?535:wx<4000?545:535}
function level(){return G.x<2000?0:G.x<4000?1:2}
function openRiddle(i){if(G.riddleOpen>=0||G.riddles[i].done)return;G.riddleOpen=i;var r=G.riddles[i],box=document.getElementById("riddle"),a=document.getElementById("ra");document.getElementById("rq").textContent=r.q;a.innerHTML="";r.a.forEach(function(t,n){var b=document.createElement("button");b.textContent=(n+1)+". "+t;b.style.cssText="padding:12px;border-radius:9px;border:1px solid #ffffff33;background:#1d2836;color:white;cursor:pointer";b.onclick=function(){answerRiddle(n)};a.appendChild(b)});box.hidden=false}function answerRiddle(n){var r=G.riddles[G.riddleOpen];if(n===r.ok){r.done=1;G.coins+=25}else G.hp-=20;document.getElementById("riddle").hidden=true;G.riddleOpen=-1}function shoot(){if(G.cool>G.t)return;G.cool=G.t+.18;var sx=G.x+18,sy=G.y+28,a=Math.atan2(my-sy,mx-(sx-G.cam));G.shots.push({x:sx,y:sy,vx:Math.cos(a)*800,vy:Math.sin(a)*800,t:1.2})}
function update(dt){var h=H[chosen],dir=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);G.t+=dt;G.vx+=(dir*h.speed-G.vx)*Math.min(1,dt*12);G.x+=G.vx*dt;var press=keys[" "]||keys.w||keys.arrowup;if(press&&G.on&&!G.jumpHeld){G.vy=-470;G.on=false;G.jumpHeld=true}if(!press){G.jumpHeld=false;if(G.vy< -170)G.vy=-170}G.vy+=1050*dt;G.y+=G.vy*dt;var gy=groundY(G.x)-62;if(G.y>=gy){G.y=gy;G.vy=0;G.on=true}G.x=Math.max(20,Math.min(5920,G.x));G.cam+=(Math.max(0,Math.min(4800,G.x-500))-G.cam)*Math.min(1,dt*5);if(keys.fire||keys.f)shoot();
for(var i=0;i<G.shots.length;i++){var q=G.shots[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt;for(var j=0;j<G.enemies.length;j++){var e=G.enemies[j];if(e.alive&&Math.abs(q.x-e.x)<35&&Math.abs(q.y-e.y)<45){e.hp-=chosen==="bacon"?38:chosen==="sinep"?42:25;q.t=0;if(e.hp<=0){e.alive=0;G.coins+=5}}}var L=level(),B=G.bosses[L];if(!B.dead&&Math.abs(q.x-B.x)<65&&Math.abs(q.y-470)<85){B.hp-=chosen==="bacon"?38:chosen==="sinep"?42:25;q.t=0;if(B.hp<=0){B.dead=1;G.done[L]=1;G.coins+=40}}}G.shots=G.shots.filter(function(q){return q.t>0});
for(var j=0;j<G.enemies.length;j++){var e=G.enemies[j];if(!e.alive)continue;if(e.type===0){e.y=315+Math.sin(G.t*2+j)*75;e.x+=Math.sin(G.t+j)*25*dt}else if(Math.abs(e.x-G.x)<350)e.x+=Math.sign(G.x-e.x)*35*dt;if(Math.abs(e.x-G.x)<35&&Math.abs(e.y-G.y)<60)G.hp-=18*dt*G.diff}
for(var c=0;c<G.chests.length;c++){var ch=G.chests[c];if(!ch.o&&Math.abs(G.x-ch.x)<55&&(keys.e||keys.enter)){ch.o=1;G.coins+=20}}for(var ri=0;ri<G.riddles.length;ri++){var rd=G.riddles[ri];if(!rd.done&&Math.abs(G.x-rd.x)<65&&(keys.e||keys.enter)){openRiddle(ri);keys.e=false;keys.enter=false}}
var L=level(),gate=(L+1)*2000-55;if((!G.done[L]||!G.riddles[L].done)&&G.x>gate)G.x=gate;var B=G.bosses[L],bb=document.getElementById("bossbar");bb.hidden=B.dead||Math.abs(G.x-B.x)>520;if(!bb.hidden)document.getElementById("bossfill").style.width=Math.max(0,B.hp/B.max*100)+"%";if(G.hp<=0){G.hp=G.max;G.x=L*2000+80;G.y=400}document.getElementById("stats").textContent="HP "+Math.ceil(G.hp)+"/"+G.max+" · Münzen "+G.coins;document.getElementById("questbox").textContent=(G.done[L]&&G.riddles[L].done)?"LEVEL "+(L+1)+" ABGESCHLOSSEN – weiter!":"Welt "+(L+1)+": Boss besiegen · Rätsel lösen · E = Truhe/Rätsel";}
function tree(x,c){x.save();var g=x.createLinearGradient(c,260,c+30,540);g.addColorStop(0,"#73503a");g.addColorStop(1,"#2b211d");x.strokeStyle=g;x.lineWidth=30;x.lineCap="round";x.beginPath();x.moveTo(c,540);x.bezierCurveTo(c-14,440,c+18,360,c,270);x.stroke();x.lineWidth=10;x.beginPath();x.moveTo(c,355);x.quadraticCurveTo(c-55,320,c-70,275);x.moveTo(c+4,330);x.quadraticCurveTo(c+60,305,c+75,265);x.stroke();var a=[[-65,265,48],[-30,230,61],[25,230,64],[65,270,49],[0,285,57]];for(var i=0;i<a.length;i++){var p=a[i],lg=x.createRadialGradient(c+p[0]-12,p[1]-12,3,c+p[0],p[1],p[2]);lg.addColorStop(0,"#7fb26b");lg.addColorStop(.55,"#3e7448");lg.addColorStop(1,"#183a26");x.fillStyle=lg;x.beginPath();x.arc(c+p[0],p[1],p[2],0,7);x.fill()}x.restore()}
function chest(x,c,y,o){x.fillStyle=o?"#554331":"#9a5b28";rr(x,c-22,y-26,44,28,5);x.fill();x.fillStyle="#d7a642";x.fillRect(c-22,y-18,44,5);x.fillRect(c-3,y-26,6,28);x.fillStyle="#f4cf69";x.fillRect(c-4,y-15,8,8)}
function enemy(x,e){if(e.type===0){x.fillStyle="#272d36";x.beginPath();x.ellipse(e.x,e.y,18,12,0,0,7);x.fill();x.beginPath();x.moveTo(e.x-10,e.y);x.quadraticCurveTo(e.x-42,e.y-30,e.x-48,e.y+3);x.quadraticCurveTo(e.x-25,e.y-3,e.x-8,e.y+5);x.fill();x.beginPath();x.moveTo(e.x+8,e.y);x.quadraticCurveTo(e.x+38,e.y-28,e.x+45,e.y+2);x.quadraticCurveTo(e.x+25,e.y-2,e.x+8,e.y+6);x.fill();x.fillStyle="#efb34d";x.beginPath();x.moveTo(e.x+17,e.y-2);x.lineTo(e.x+31,e.y+3);x.lineTo(e.x+17,e.y+7);x.fill()}else{ x.strokeStyle="#ddd8c7";x.lineWidth=6;x.lineCap="round";x.beginPath();x.arc(e.x,e.y-25,12,0,7);x.moveTo(e.x,e.y-12);x.lineTo(e.x,e.y+22);x.moveTo(e.x,e.y);x.lineTo(e.x-20,e.y+10);x.moveTo(e.x,e.y);x.lineTo(e.x+20,e.y+8);x.moveTo(e.x,e.y+20);x.lineTo(e.x-15,e.y+43);x.moveTo(e.x,e.y+20);x.lineTo(e.x+15,e.y+43);x.stroke();if(e.type===2){x.fillStyle="#76b9db";x.beginPath();x.arc(e.x,e.y-25,5,0,7);x.fill()}}}
function player(x){var cx=G.x+18,cy=G.y+28,a=Math.atan2(my-cy,mx-(cx-G.cam)),face=Math.cos(a)<0?-1:1,run=Math.sin(G.t*12)*Math.min(1,Math.abs(G.vx)/100);x.save();x.translate(cx,cy);if(face<0)x.scale(-1,1);var aa=face<0?Math.PI-a:a;x.fillStyle="#0005";x.beginPath();x.ellipse(0,36,25,7,0,0,7);x.fill();x.strokeStyle="#2b3037";x.lineWidth=9;x.lineCap="round";x.beginPath();x.moveTo(-7,20);x.lineTo(-10+run*9,50);x.moveTo(7,20);x.lineTo(10-run*9,50);x.stroke();x.fillStyle=H[chosen].color;rr(x,-18,-18,36,45,13);x.fill();x.fillStyle="#d6a184";x.beginPath();x.arc(0,-34,14,0,7);x.fill();x.fillStyle="#38251f";if(chosen==="nexify"){x.fillStyle="#101820";x.beginPath();x.arc(0,-39,15,Math.PI,6.3);x.fill();x.fillRect(8,-40,20,5)}else if(chosen==="sinep"){x.beginPath();x.arc(0,-38,16,Math.PI,6.3);x.fill();x.fillRect(-15,-37,7,38)}else{x.beginPath();x.arc(0,-40,14,Math.PI,6.3);x.fill()}x.fillStyle="#fff";x.beginPath();x.arc(5,-34,2.4,0,7);x.fill();x.fillStyle="#1a1716";x.beginPath();x.arc(6,-34,1,0,7);x.fill();x.strokeStyle="#b77961";x.lineWidth=2;x.beginPath();x.arc(4,-28,5,.2,1.4);x.stroke();x.save();x.translate(2,-7);x.rotate(aa);x.strokeStyle="#c98e71";x.lineWidth=9;x.beginPath();x.moveTo(0,0);x.lineTo(26,0);x.stroke();x.fillStyle="#262d35";rr(x,22,-6,chosen==="bacon"?68:55,12,5);x.fill();x.fillStyle="#8e9aa5";x.fillRect(40,-3,chosen==="bacon"?48:35,5);x.restore();x.strokeStyle="#c98e71";x.lineWidth=8;x.beginPath();x.moveTo(-9,-4);x.lineTo(8,8);x.stroke();x.restore()}
function riddleStone(x,r){if(r.done)return;x.fillStyle="#2a3441";rr(x,r.x-18,485,36,50,8);x.fill();x.fillStyle="#e6bb62";x.font="bold 24px Arial";x.fillText("?",r.x-7,519)}function coin(x,c,y){x.fillStyle="#f1c84c";x.beginPath();x.arc(c,y,7,0,7);x.fill();x.strokeStyle="#fff3a5";x.lineWidth=2;x.stroke()}function boss(x,b,L){if(b.dead)return;var col=L===0?"#76482f":L===1?"#8b7963":"#6d8498";x.fillStyle=col;rr(x,b.x-43,430,86,105,25);x.fill();x.fillStyle="#c9a27f";x.beginPath();x.arc(b.x,414,30,0,7);x.fill();x.fillStyle=L===2?"#dbe8f1":"#38251f";x.beginPath();x.arc(b.x,405,31,Math.PI,6.3);x.fill();x.fillStyle="#ff5c4d";x.beginPath();x.arc(b.x-9,416,4,0,7);x.arc(b.x+9,416,4,0,7);x.fill()}
function draw(){var x=cv.getContext("2d"),L=level(),sky=[["#102f35","#78936c"],["#6a4931","#d9ad67"],["#2e3d50","#aebbc4"]][L],g=x.createLinearGradient(0,0,0,620);g.addColorStop(0,sky[0]);g.addColorStop(1,sky[1]);x.fillStyle=g;x.fillRect(0,0,1100,620);x.save();x.translate(-G.cam,0);if(L===0){for(var i=0;i<12;i++)tree(x,i*190)}else if(L===1){x.fillStyle="#b98b50";for(var i=10;i<22;i++){x.beginPath();x.moveTo(i*190-120,545);x.quadraticCurveTo(i*190,390,i*190+140,545);x.fill()}x.fillStyle="#72573e";for(var r=0;r<4;r++){var rx=2250+r*430;x.fillRect(rx,390,32,155);x.fillRect(rx-35,390,100,18)}}else{x.fillStyle="#536373";for(var i=20;i<33;i++){x.beginPath();x.moveTo(i*190-120,535);x.lineTo(i*190,240+(i%3)*55);x.lineTo(i*190+150,535);x.fill();x.fillStyle="#e0e9ee";x.beginPath();x.moveTo(i*190-35,330+(i%3)*55);x.lineTo(i*190,240+(i%3)*55);x.lineTo(i*190+40,335+(i%3)*55);x.fill();x.fillStyle="#536373"}}x.fillStyle=L===0?"#263f2c":L===1?"#8a6742":"#46535e";x.fillRect(L*2000,groundY(G.x),2000,100);for(var c=0;c<G.chests.length;c++){var ch=G.chests[c];if(Math.floor(ch.x/2000)===L)chest(x,ch.x,groundY(ch.x),ch.o)}riddleStone(x,G.riddles[L]);for(var cc=0;cc<7;cc++)coin(x,L*2000+300+cc*180,465-Math.sin(cc)*45);for(var e=0;e<G.enemies.length;e++)if(G.enemies[e].alive&&G.enemies[e].type===L)enemy(x,G.enemies[e]);boss(x,G.bosses[L],L);for(var q=0;q<G.shots.length;q++){var sh=G.shots[q];x.fillStyle="#ffd66b";x.beginPath();x.arc(sh.x,sh.y,4,0,7);x.fill()}player(x);x.restore()}
function loop(t){if(!running)return;var dt=Math.min(.032,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}</script></body></html>
