<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fang die Sineps</title><style>
*{box-sizing:border-box}body{margin:0;background:#070a10;color:#fff;font-family:Arial,sans-serif}#app{max-width:1200px;margin:auto;padding:24px}#menu{background:#121925;border:1px solid #394355;border-radius:24px;padding:30px;margin-top:4vh}h1{font-size:48px;margin:5px 0 12px}.gold{color:#e6bb62;font-weight:bold}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}.hero{border:2px solid #394355;border-radius:18px;background:#1a2230;color:#fff;padding:0 0 20px;cursor:pointer;text-align:left}.hero.sel{border:4px solid #e6bb62}.pic{height:190px;display:grid;place-items:center;font-size:70px;border-radius:14px 14px 0 0}.b{background:#5d3d2d}.n{background:#24596d}.s{background:#51376b}.hero b,.hero small{display:block;margin:14px 18px 0}.hero b{font-size:24px}.hero small{color:#b9c0ca}.row{display:flex;gap:16px;align-items:end}select,#start{font-size:18px;padding:14px;border-radius:10px;border:1px solid #566174;background:#202a39;color:#fff}#start{margin-left:auto;background:#e6bb62;color:#17110a;font-weight:bold;cursor:pointer}.status{margin-top:18px;color:#e6bb62;font-weight:bold}#stage{position:relative}canvas{width:100%;height:auto;background:#172a2b;border-radius:18px;display:block}#hud{position:absolute;top:10px;left:10px;background:#000b;padding:9px;border-radius:8px;z-index:2}@media(max-width:700px){.cards{grid-template-columns:1fr}.row{flex-direction:column;align-items:stretch}#start{margin:0}}
</style></head><body><div id="app"><section id="menu"><div class="gold">FANG DIE SINEPS</div><h1>Wähle deinen Jäger</h1><p>Direkter, eigenständiger Browser-Build ohne externe Dateien.</p><div class="cards"><button class="hero sel" onclick="pick('bacon',this)"><div class="pic b">💪</div><b>BACON</b><small>Brecher · Schrotflinte · Berserker</small></button><button class="hero" onclick="pick('nexify',this)"><div class="pic n">🧢</div><b>NexifyGG</b><small>Revolverheld · schnell · Dash</small></button><button class="hero" onclick="pick('sinep',this)"><div class="pic s">✦</div><b>SINEP</b><small>Arkanistin · Runengewehr · Blink</small></button></div><div class="row"><label>Schwierigkeit<br><select id="difficulty" onchange="diffChanged()"><option>Jäger</option><option selected>Veteran</option><option>Albtraum</option></select></label><button id="start" onclick="startGame()">ABENTEUER STARTEN →</button></div><div class="status" id="status">Ausgewählt: BACON · Schwierigkeit: Veteran</div></section><main id="stage" hidden><div id="hud">FANG DIE SINEPS · <span id="who">BACON</span> · A/D bewegen · Leertaste springen</div><canvas id="game" width="1100" height="620"></canvas></main></div><script>
var chosen="bacon",running=false,px=80,py=480,vy=0,keys={};
function pick(n,el){chosen=n;document.querySelectorAll(".hero").forEach(function(x){x.classList.remove("sel")});el.classList.add("sel");showStatus()}
function diffChanged(){showStatus()}
function showStatus(){document.getElementById("status").textContent="Ausgewählt: "+(chosen==="nexify"?"NexifyGG":chosen==="sinep"?"SINEP":"BACON")+" · Schwierigkeit: "+document.getElementById("difficulty").value}
function startGame(){document.getElementById("menu").hidden=true;document.getElementById("stage").hidden=false;document.getElementById("who").textContent=chosen==="nexify"?"NexifyGG":chosen==="sinep"?"SINEP":"BACON";running=true;requestAnimationFrame(loop)}
addEventListener("keydown",function(e){keys[e.key.toLowerCase()]=true});addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false});
var mx=800,my=330;document.getElementById("game").addEventListener("mousemove",function(e){var r=this.getBoundingClientRect();mx=(e.clientX-r.left)*this.width/r.width;my=(e.clientY-r.top)*this.height/r.height});
function tree(x,cx,cy){var grd=x.createLinearGradient(cx,250,cx+45,545);grd.addColorStop(0,"#65432b");grd.addColorStop(.55,"#3c291f");grd.addColorStop(1,"#211b17");x.strokeStyle=grd;x.lineWidth=34;x.lineCap="round";x.beginPath();x.moveTo(cx,545);x.bezierCurveTo(cx-8,455,cx+18,380,cx+5,285);x.stroke();x.lineWidth=12;x.beginPath();x.moveTo(cx+3,350);x.quadraticCurveTo(cx-45,315,cx-62,280);x.moveTo(cx+8,325);x.quadraticCurveTo(cx+55,295,cx+72,260);x.stroke();var leaves=[[-65,260,54],[-25,230,68],[30,235,70],[70,270,55],[-5,285,65]];for(var i=0;i<leaves.length;i++){var q=leaves[i],lg=x.createRadialGradient(cx+q[0]-12,q[1]-14,5,cx+q[0],q[1],q[2]);lg.addColorStop(0,"#6e9d5d");lg.addColorStop(.55,"#32633e");lg.addColorStop(1,"#173823");x.fillStyle=lg;x.beginPath();x.arc(cx+q[0],q[1],q[2],0,7);x.fill()}x.strokeStyle="#294d2f";x.lineWidth=5;x.beginPath();x.moveTo(cx+58,280);x.bezierCurveTo(cx+75,345,cx+40,390,cx+65,445);x.stroke()}
function character(x){var col=chosen==="bacon"?"#c9783f":chosen==="nexify"?"#3f9fc1":"#9662c5",cx=px+18,cy=py+20,ang=Math.atan2(my-(cy+15),mx-cx),flip=Math.cos(ang)<0?-1:1;x.save();x.translate(cx,cy);if(flip<0)x.scale(-1,1);var a=flip<0?Math.PI-ang:ang;x.fillStyle="#1117";x.beginPath();x.ellipse(0,42,27,8,0,0,7);x.fill();x.strokeStyle="#252b32";x.lineWidth=11;x.lineCap="round";x.beginPath();x.moveTo(-7,27);x.lineTo(-12,55);x.moveTo(8,27);x.lineTo(14,55);x.stroke();x.fillStyle=col;x.beginPath();x.roundRect(-19,-18,38,52,12);x.fill();x.fillStyle="#d3a080";x.beginPath();x.arc(0,-32,14,0,7);x.fill();if(chosen==="nexify"){x.fillStyle="#101820";x.beginPath();x.arc(0,-37,15,Math.PI,6.3);x.fill();x.fillRect(8,-39,20,5)}else if(chosen==="sinep"){x.fillStyle="#2a1d31";x.beginPath();x.arc(-1,-35,16,Math.PI,6.3);x.fill();x.fillRect(-15,-34,7,40)}else{x.fillStyle="#493023";x.beginPath();x.arc(0,-38,14,Math.PI,6.3);x.fill()}x.save();x.translate(3,-10);x.rotate(a);x.strokeStyle="#c58c70";x.lineWidth=9;x.beginPath();x.moveTo(0,0);x.lineTo(27,0);x.stroke();x.fillStyle="#242a32";x.beginPath();x.roundRect(20,-6,chosen==="bacon"?66:54,12,5);x.fill();x.fillStyle="#89939d";x.fillRect(38,-3,chosen==="bacon"?48:36,5);x.restore();x.restore()}
function loop(){if(!running)return;var c=document.getElementById("game"),x=c.getContext("2d");if(keys.a)px-=4;if(keys.d)px+=4;if((keys[" "]||keys.w)&&py>=480)vy=-14;vy+=.7;py+=vy;if(py>480){py=480;vy=0}px=Math.max(10,Math.min(1060,px));var g=x.createLinearGradient(0,0,0,620);g.addColorStop(0,"#102d34");g.addColorStop(.52,"#547966");g.addColorStop(1,"#a6a26c");x.fillStyle=g;x.fillRect(0,0,1100,620);x.fillStyle="#d6e3ce22";for(var m=0;m<5;m++){x.beginPath();x.ellipse(150+m*250,390,230,65,0,0,7);x.fill()}for(var i=0;i<6;i++)tree(x,70+i*215,0);x.fillStyle="#233d2b";x.fillRect(0,540,1100,80);x.fillStyle="#527044";for(var k=0;k<55;k++){var gx=(k*83)%1100;x.fillRect(gx,532+(k%3)*3,3,12)}character(x);requestAnimationFrame(loop)}
</script></body></html>
